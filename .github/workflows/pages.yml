name: Publish website

on:
  push:
    branches: [main]
    paths:
      - site/**
      - src/main/java/net/blockhost/anarchyclient/module/**
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - site/**
      - src/main/java/net/blockhost/anarchyclient/module/**
      - .github/workflows/pages.yml
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A published release rebuilds the current site to refresh its download.
          ref: ${{ github.event_name == 'release' && 'main' || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "26"
          # This job publishes the site, so it must not restore caches that other runs wrote.
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - name: Build static site
        run: bun run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install test browser
        run: bunx --no-install playwright install --with-deps chromium --only-shell
      - run: bun run test:e2e
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist/client

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

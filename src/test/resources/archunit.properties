# Violations frozen by ArchitectureTest. The store shrinks on its own as violations get fixed.
# To accept a new violation on purpose, run the tests once with -Darchunit.freeze.refreeze=true.
freeze.store.default.path=src/test/resources/archunit_store
# Find every cycle, so the frozen set is the same on every run.
cycles.maxNumberToDetect=100000
# List one example dependency per edge; the store only needs to identify the cycle.
cycles.maxNumberOfDependenciesPerEdge=1
